name: TWALA Frontend Validation
on:
  push:
    branches: [main, feature/complete-interactive-frontend]
  pull_request:
    branches: [main]
jobs:
  operations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: twala-platform/apps/operations_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dashboard dependencies
        run: npm install --no-audit --no-fund
      - name: Demo engine tests
        run: node --experimental-strip-types --test src/lib/demo-engine.test.mts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
  flutter:
    name: Flutter ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, captain_app]
    defaults:
      run:
        working-directory: twala-platform/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Flutter tests
        run: |
          if [ -d test ] && find test -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo 'No Flutter tests found; static analysis completed.'
          fi
